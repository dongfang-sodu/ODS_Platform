apiVersion: v1
kind: ConfigMap
metadata:
  name: ods-config
data:
  SPRING_PROFILES_ACTIVE: postgres
  DB_URL: jdbc:postgresql://postgres:5432/ods
  DB_USERNAME: ods
  DB_POOL_MAX_SIZE: "10"
  DB_POOL_MIN_IDLE: "2"
  ODS_SEED_ENABLED: "false"
  JWT_EXPIRATION_MINUTES: "15"
  REFRESH_TOKEN_HOURS: "8"
  PASSWORD_RESET_MAIL_ENABLED: "false"
  PASSWORD_RESET_MAIL_FROM: no-reply@ods.local
  PASSWORD_RESET_BASE_URL: https://ods.example.com/reset-password
  CORS_ALLOWED_ORIGINS: https://ods.example.com
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ods
