apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ods
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - ods.example.com
      secretName: ods-tls
  rules:
    - host: ods.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
