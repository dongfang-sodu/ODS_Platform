map $http_x_forwarded_proto $ods_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $ods_forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
}

limit_req_zone $binary_remote_addr zone=ods_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ods_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/v1/auth/login {
        limit_req zone=ods_login burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $ods_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ods_forwarded_proto;
        proxy_set_header X-Forwarded-Host $ods_forwarded_host;
    }

    location /api/ {
        limit_req zone=ods_api burst=60 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $ods_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ods_forwarded_proto;
        proxy_set_header X-Forwarded-Host $ods_forwarded_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
