map $http_x_forwarded_proto $ods_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $ods_forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $ods_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ods_forwarded_proto;
        proxy_set_header X-Forwarded-Host $ods_forwarded_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
